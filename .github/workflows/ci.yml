name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          # Build-time placeholders so `next build` doesn't fail on missing env.
          # Real values are provided by the deployment environment at runtime.
          NEXTAUTH_SECRET: ci-placeholder-secret
          NEXTAUTH_URL: http://localhost:3000
          DISCORD_CLIENT_ID: ci-placeholder
          DISCORD_CLIENT_SECRET: ci-placeholder
          BOT_API_URL: http://localhost:4000
          BOT_API_KEY: ci-placeholder
          ADMIN_IDS: "0"
